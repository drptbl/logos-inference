name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The logos-agents release this repo builds on, used unchanged: its binary, and its
  # checkout for the demo helpers in scripts/.
  LOGOS_AGENTS_VERSION: v0.4.0
  LOGOS_AGENTS_COMMIT: b50270fc5d073e38327e8d70417266fdda268fc9
  # The x86_64 Linux release tarball's sha256, pinned here rather than read from the release.
  LOGOS_AGENTS_SHA256: c2a16df79dc935318fe5875f9247122a22c52033262d1151ad0b779b87adc658
  # The demo's model: Qwen2.5 0.5B Instruct, Q4_K_M, at a fixed revision.
  MODEL: qwen2.5-0.5b-instruct
  MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/9217f5db79a29953eb74d5343926648285ec7e67/qwen2.5-0.5b-instruct-q4_k_m.gguf
  MODEL_SHA256: 74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db
  # llama.cpp's CPU server image, by digest.
  LLAMA_SERVER: ghcr.io/ggml-org/llama.cpp:server@sha256:2103d1f4f2e2e223ad80587dcb39fc15a9f912f29ae1fa9fc1193fe8c1aea82f

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # A paid inference job on a local LEZ devnet: scripts/demo.py, with a small model on
  # llama.cpp's server as the backend.
  devnet-demo:
    # The devnet runs in Docker, so it needs a Linux runner.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: drptbl/logos-agents
          ref: ${{ env.LOGOS_AGENTS_COMMIT }}
          path: logos-agents
          persist-credentials: false
      - name: Install logos-agents
        run: |
          set -euo pipefail
          name="logos-agents-$LOGOS_AGENTS_VERSION-x86_64-unknown-linux-gnu"
          dir="$RUNNER_TEMP/logos-agents-bin"
          mkdir -p "$dir"
          cd "$dir"
          url="https://github.com/drptbl/logos-agents/releases/download/$LOGOS_AGENTS_VERSION/$name.tar.gz"
          curl -fsSL --retry 3 -o "$name.tar.gz" "$url"
          echo "$LOGOS_AGENTS_SHA256  $name.tar.gz" | sha256sum -c
          tar -xzf "$name.tar.gz"
          echo "$dir/$name" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/model
          key: model-${{ env.MODEL_SHA256 }}
      - name: Start the model
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/model"
          gguf="$RUNNER_TEMP/model/model.gguf"
          if ! echo "$MODEL_SHA256  $gguf" | sha256sum -c --status 2>/dev/null; then
            curl -fsSL --retry 3 -o "$gguf" "$MODEL_URL"
            echo "$MODEL_SHA256  $gguf" | sha256sum -c
          fi
          docker run -d --name llama-server -p 127.0.0.1:8081:8080 -v "$RUNNER_TEMP/model:/models:ro" \
            "$LLAMA_SERVER" -m /models/model.gguf --alias "$MODEL" --host 0.0.0.0 --port 8080 -c 2048
          for _ in $(seq 120); do
            if curl -fs http://127.0.0.1:8081/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs llama-server
          exit 1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked
      # Installs logosctl for the sessions, then starts the devnet from logos-devnet.toml.
      - uses: drptbl/logos-devnet@7c47c38af6eaf801113ddfc0a4eea7bac5b4bb1d # v0.6.1
      - run: >-
          python3 scripts/demo.py --agents logos-agents --agents-bin logos-agents
          --backend http://127.0.0.1:8081/v1 --model "$MODEL" --timeout 600
      - if: always()
        run: docker logs llama-server > "$RUNNER_TEMP/llama-server.log" 2>&1 || true
      # Each server's log, which the demo keeps in a logos-inference-demo-* folder.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devnet-demo-logs
          path: |
            /tmp/logos-inference-demo-*
            ${{ runner.temp }}/llama-server.log
          if-no-files-found: ignore
