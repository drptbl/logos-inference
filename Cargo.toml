[package]
name = "logos-inference"
version = "0.2.0"
edition = "2024"
description = "Decentralised AI inference over Logos, on logos-agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/drptbl/logos-inference"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
rmcp = { version = "3.9.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
tiny_http = "0.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "time"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] }

