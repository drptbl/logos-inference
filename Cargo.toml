[package]
name = "logos-inference"
version = "0.1.0"
edition = "2024"
description = "Decentralised AI inference over Logos, on logos-agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/drptbl/logos-inference"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
serde_json = "1.0.154"
tiny_http = "0.12.0"
ureq = { version = "3.5.2", default-features = false, features = ["json"] }
